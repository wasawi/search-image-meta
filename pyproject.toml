[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "search-image-meta"
version = "0.2.0"
description = "Search image metadata (EXIF, XMP, IPTC, PNG text, ComfyUI graphs) for strings, in parallel."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["pillow>=9.1"]
keywords = ["metadata", "exif", "xmp", "comfyui", "stable-diffusion", "search"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]

[project.optional-dependencies]
heif = ["pillow-heif"]
test = ["pytest>=7", "av>=12", "pillow-heif"]

[project.scripts]
search-image-meta = "search_string_image_meta:cli"

[tool.setuptools]
py-modules = ["search_string_image_meta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
